<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code Live Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 15px;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            max-height: 70vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .message {
            margin-bottom: 25px;
            padding: 18px;
            border-radius: 15px;
            word-wrap: break-word;
            animation: slideIn 0.3s;
            transition: transform 0.2s;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message:hover {
            transform: translateX(5px);
        }

        .message.user {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(37, 99, 235, 0.3));
            margin-left: 60px;
            border-left: 4px solid #3b82f6;
        }

        .message.assistant {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(124, 58, 237, 0.3));
            margin-right: 60px;
            border-left: 4px solid #8b5cf6;
        }

        .message-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-content {
            line-height: 1.7;
            white-space: pre-wrap;
            font-size: 15px;
        }

        .timestamp {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 8px;
            font-style: italic;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 15px 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-text {
            font-size: 14px;
            opacity: 0.8;
        }

        .refresh-info {
            font-size: 12px;
            opacity: 0.6;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Claude Code Live</h1>
            <p class="subtitle">Real-time conversation stream</p>
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>LIVE</span>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <p>Waiting for messages...</p>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-text" id="status">Connected</div>
            <div class="refresh-info">Auto-refresh every 2 seconds</div>
        </div>
    </div>

    <script>
        let lastMessageCount = 0;
        let isFirstLoad = true;

        function formatTimestamp(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        async function loadMessages() {
            try {
                const response = await fetch('/api/messages?t=' + Date.now());
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to load messages');
                }

                const container = document.getElementById('chatContainer');
                const messages = data.messages || [];

                if (messages.length === 0) {
                    if (isFirstLoad) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">💬</div>
                                <p>No messages yet. Start chatting in Claude Code!</p>
                            </div>
                        `;
                    }
                    document.getElementById('status').textContent = 'Waiting for messages...';
                    return;
                }

                // Только обновляем если есть новые сообщения
                if (messages.length !== lastMessageCount) {
                    if (isFirstLoad) {
                        container.innerHTML = '';
                        messages.forEach(msg => addMessageToDOM(msg));
                        isFirstLoad = false;
                    } else {
                        // Добавляем только новые сообщения
                        const newMessages = messages.slice(lastMessageCount);
                        newMessages.forEach(msg => addMessageToDOM(msg));
                    }

                    // Scroll to bottom
                    container.scrollTop = container.scrollHeight;
                    lastMessageCount = messages.length;
                }

                document.getElementById('status').textContent = `${messages.length} messages`;
            } catch (error) {
                console.error('Error loading messages:', error);
                document.getElementById('status').textContent = '❌ Connection error';
            }
        }

        function addMessageToDOM(msg) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            const role = msg.role || msg.type || 'unknown';
            div.className = `message ${role === 'human' ? 'user' : role}`;

            const label = document.createElement('div');
            label.className = 'message-label';
            const icon = (role === 'user' || role === 'human') ? '👤' : '🤖';
            const name = (role === 'user' || role === 'human') ? 'User' : 'Claude';
            label.innerHTML = `${icon} ${name}`;

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = msg.content;

            div.appendChild(label);
            div.appendChild(content);

            if (msg.timestamp) {
                const timestamp = document.createElement('div');
                timestamp.className = 'timestamp';
                timestamp.textContent = formatTimestamp(msg.timestamp);
                div.appendChild(timestamp);
            }

            container.appendChild(div);
        }
            }
        }

        // Load immediately
        loadMessages();

        // Refresh every 2 seconds
        setInterval(loadMessages, 2000);
    </script>
</body>
</html>
