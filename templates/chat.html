<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Claude Live Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            max-height: 60vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .message.human {
            background: rgba(100, 200, 255, 0.3);
            margin-left: 20px;
        }

        .message.assistant {
            background: rgba(150, 100, 255, 0.3);
            margin-right: 20px;
        }

        .message-type {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.4;
        }

        .input-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        .input-box input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-box button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .input-box button:active {
            transform: scale(0.95);
        }


        .status {
            text-align: center;
            font-size: 12px;
            opacity: 0.7;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💬 Claude Live Chat</h1>
        <p>Web Interface</p>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="loading">Loading chat...</div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <input type="text" id="messageInput" placeholder="Send command to Claude...">
            <button onclick="sendMessage()">Send</button>
        </div>
        <div class="status" id="status">Connected</div>
    </div>

    <script>
        let lastMessageCount = 0;

        function loadChat() {
            fetch('/api/chat/recent')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('chatContainer');

                    if (data.messages && data.messages.length > 0) {
                        container.innerHTML = '';

                        data.messages.forEach(msg => {
                            const div = document.createElement('div');
                            div.className = `message ${msg.type}`;

                            const typeDiv = document.createElement('div');
                            typeDiv.className = 'message-type';
                            typeDiv.textContent = msg.type === 'human' ? 'User' : 'Claude';

                            const contentDiv = document.createElement('div');
                            contentDiv.className = 'message-content';
                            contentDiv.textContent = msg.content;

                            div.appendChild(typeDiv);
                            div.appendChild(contentDiv);
                            container.appendChild(div);
                        });

                        // Scroll to bottom
                        container.scrollTop = container.scrollHeight;

                        lastMessageCount = data.messages.length;
                    }
                })
                .catch(err => {
                    console.error('Error loading chat:', err);
                    document.getElementById('status').textContent = 'Connection error';
                });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Add message to chat immediately
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message human';

            const typeDiv = document.createElement('div');
            typeDiv.className = 'message-type';
            typeDiv.textContent = 'You → Claude';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = message;

            div.appendChild(typeDiv);
            div.appendChild(contentDiv);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            input.value = '';
            document.getElementById('status').textContent = 'Sending...';

            fetch('/api/chat/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').textContent = 'Sent! Claude will respond soon.';

                setTimeout(() => {
                    document.getElementById('status').textContent = 'Connected';
                }, 3000);
            })
            .catch(err => {
                document.getElementById('status').textContent = 'Error sending message';
                console.error('Send error:', err);
            });
        }

        // Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Load chat initially
        loadChat();

        // Refresh every 3 seconds
        setInterval(loadChat, 3000);
    </script>
</body>
</html>
