<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .api-key-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .api-key-section input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .api-key-section input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .api-key-section button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .message.user {
            background: rgba(100, 200, 255, 0.3);
            margin-left: 40px;
        }

        .message.assistant {
            background: rgba(150, 100, 255, 0.3);
            margin-right: 40px;
        }

        .message-label {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        .input-box textarea {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            resize: vertical;
            min-height: 50px;
            font-family: inherit;
        }

        .input-box textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-end;
        }

        .input-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .status {
            text-align: center;
            font-size: 12px;
            opacity: 0.7;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Claude Chat</h1>
            <p>Web Interface for Claude API</p>
        </div>

        <div class="api-key-section" id="apiKeySection">
            <h3 style="margin-bottom: 10px;">Enter your Claude API Key</h3>
            <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-...">
            <button onclick="saveApiKey()">Save Key</button>
            <p style="font-size: 12px; margin-top: 10px; opacity: 0.7;">
                Get your API key from <a href="https://console.anthropic.com/settings/keys" target="_blank" style="color: #4ade80;">console.anthropic.com</a>
            </p>
        </div>

        <div class="hidden" id="chatSection">
            <div class="chat-container" id="chatContainer">
                <div style="text-align: center; opacity: 0.7;">Start a conversation with Claude</div>
            </div>

            <div class="input-section">
                <div class="input-box">
                    <textarea id="messageInput" placeholder="Type your message..."></textarea>
                    <button onclick="sendMessage()" id="sendButton">Send</button>
                </div>
                <div class="status" id="status"></div>
            </div>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('claude_api_key');
        let conversationHistory = [];

        if (apiKey) {
            document.getElementById('apiKeySection').classList.add('hidden');
            document.getElementById('chatSection').classList.remove('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                alert('Please enter an API key');
                return;
            }
            localStorage.setItem('claude_api_key', key);
            apiKey = key;
            document.getElementById('apiKeySection').classList.add('hidden');
            document.getElementById('chatSection').classList.remove('hidden');
        }

        function addMessage(role, content) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = role === 'user' ? 'You' : 'Claude';

            const contentDiv = document.createElement('div');
            contentDiv.textContent = content;

            div.appendChild(label);
            div.appendChild(contentDiv);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;
            document.getElementById('status').textContent = 'Sending...';

            addMessage('user', message);
            conversationHistory.push({ role: 'user', content: message });
            input.value = '';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 4096,
                        messages: conversationHistory
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    const errorMsg = data.error?.message || `API error: ${response.status}`;
                    throw new Error(errorMsg);
                }

                const assistantMessage = data.content[0].text;

                addMessage('assistant', assistantMessage);
                conversationHistory.push({ role: 'assistant', content: assistantMessage });

                document.getElementById('status').textContent = '';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').textContent = 'Error: ' + error.message;
                addMessage('assistant', 'Error: ' + error.message);
            } finally {
                sendButton.disabled = false;
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
